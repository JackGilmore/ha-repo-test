name: Inker
version: "0.5.0"
slug: inker
description: TRMNL self host implementation
url: https://github.com/wojooo/inker

arch:
  - aarch64
  - amd64

startup: services
boot: auto
init: false

image: docker.io/wojooo/inker

ports:
  80/tcp: 15297

map:
  - addon_config:rw

options:
  tz: Europe/London
  admin_pin: "1111"

schema:
  tz: str
  admin_pin: password

environment:
  TZ: "{options.tz}"
  ADMIN_PIN: "{options.admin_pin}"